name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (for example, 4.0.0 or 4.0.0.M1)
        required: true
        type: string
      next_snapshot_version:
        description: Next snapshot version (for example, 4.0.1-SNAPSHOT; use 4.0.0-SNAPSHOT after 4.0.0.M1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_VERSION: ${{ inputs.release_version }}
  NEXT_SNAPSHOT_VERSION: ${{ inputs.next_snapshot_version }}
  TAG_NAME: ${{ inputs.release_version }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  RELEASE_REF: ${{ github.ref }}
  MAVEN_OPTS: -Xmx2g -Dmaven.wagon.http.retryHandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=25

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-26.04

    steps:
      - name: Validate release inputs
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.M[1-9][0-9]*)?$ ]]; then
            echo "::error::Invalid release version: $RELEASE_VERSION"
            exit 1
          fi

          if [[ ! "$NEXT_SNAPSHOT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::Invalid next snapshot version: $NEXT_SNAPSHOT_VERSION"
            exit 1
          fi

          if [[ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            if [[ ! "$RELEASE_REF" =~ ^refs/heads/[0-9]+\.[0-9]+\.x$ ]]; then
              echo "::error::Select the default branch or a maintenance branch named <major>.<minor>.x"
              exit 1
            fi

            series="${RELEASE_REF#refs/heads/}"
            series="${series%.x}"
            if [[ "$RELEASE_VERSION" != "$series".* || "$NEXT_SNAPSHOT_VERSION" != "$series".* ]]; then
              echo "::error::Both versions must be in the $series.x release line"
              exit 1
            fi
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.JUPNP_APP_CLIENT_ID }}
          private-key: ${{ secrets.JUPNP_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout selected commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify current version and tag
        run: |
          current_version="$(./mvnw -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"

          # Milestones and the final release share the same development snapshot.
          expected_version="${RELEASE_VERSION%%.M*}-SNAPSHOT"

          if [[ "$current_version" != "$expected_version" ]]; then
            echo "::error::Expected current version $expected_version, but found $current_version"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1
          then
            echo "::error::Tag $TAG_NAME already exists"
            exit 1
          fi

      - name: Set release version
        run: ./mvnw -B -ntp versions:set -DnewVersion="$RELEASE_VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Verify release build and update runbundles
        run: ./mvnw -B -ntp clean install -DwithResolver -DskipTests

      - name: Validate release changes
        run: |
          git diff --check

          unexpected_files="$(git diff --name-only | grep -vE '(^|/)pom\.xml$|^itests/.*\.bndrun$' || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "::error::Release preparation changed unexpected files:"
            echo "$unexpected_files"
            exit 1
          fi

          untracked_files="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked_files" ]]; then
            echo "::error::Release preparation created untracked files:"
            echo "$untracked_files"
            exit 1
          fi

          git add -u -- .

      - name: Commit and tag release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "Release version $RELEASE_VERSION"
          git tag -a "$TAG_NAME" -m "Release version $RELEASE_VERSION"
          git push --atomic origin "HEAD:$RELEASE_REF" "refs/tags/$TAG_NAME"

  publish:
    name: Publish to Maven Central
    needs: prepare-release
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17 and Maven Central credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: sonatype-central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          mvn-server-repository-origins: |
            sonatype-central:https://central.sonatype.com
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: GPG_PASSPHRASE

      - name: Publish release
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp clean deploy -DsignArtifacts -DskipTests

  finalize-release:
    name: Create GitHub release and next snapshot
    needs: publish
    runs-on: ubuntu-26.04

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.JUPNP_APP_CLIENT_ID }}
          private-key: ${{ secrets.JUPNP_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            release_flags=()
            if [[ "$RELEASE_VERSION" == *.M* ]]; then
              release_flags+=(--prerelease --latest=false)
            else
              published_versions="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '
                .[] | select(.draft == false and .prerelease == false) | .tag_name
                | select(test("^[0-9]+[.][0-9]+[.][0-9]+$"))
              ')"
              highest_version="$(printf '%s\n' "$published_versions" "$RELEASE_VERSION" | LC_ALL=C sort -V | tail -n 1)"
              if [[ "$RELEASE_VERSION" == "$highest_version" ]]; then
                release_flags+=(--latest=true)
              else
                release_flags+=(--latest=false)
              fi
            fi

            if [[ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              series="${RELEASE_REF#refs/heads/}"
              series="${series%.x}"
              if previous_tag="$(git describe --tags --abbrev=0 --match "$series.[0-9]*" --exclude "$series.*[!0-9]*" "refs/tags/$TAG_NAME^" 2>/dev/null)"; then
                release_flags+=(--notes-start-tag "$previous_tag")
              fi
            fi

            gh release create "$TAG_NAME" --verify-tag --generate-notes --title "JUPnP $RELEASE_VERSION" "${release_flags[@]}"
          fi

      - name: Set next snapshot version
        run: |
          current_version="$(./mvnw -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "$current_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::Expected current version $RELEASE_VERSION, but found $current_version"
            exit 1
          fi
          ./mvnw -B -ntp versions:set -DnewVersion="$NEXT_SNAPSHOT_VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Update runbundles
        run: ./mvnw -B -ntp clean install -DwithResolver -DskipTests

      - name: Validate snapshot changes
        run: |
          git diff --check

          unexpected_files="$(git diff --name-only | grep -vE '(^|/)pom\.xml$|^itests/.*\.bndrun$' || true)"

          if [[ -n "$unexpected_files" ]]; then
            echo "::error::Snapshot preparation changed unexpected files:"
            echo "$unexpected_files"
            exit 1
          fi

          untracked_files="$(git ls-files --others --exclude-standard)"

          if [[ -n "$untracked_files" ]]; then
            echo "::error::Snapshot preparation created untracked files:"
            echo "$untracked_files"
            exit 1
          fi

          git add -u -- .

      - name: Commit next snapshot version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "Prepare for next development iteration: $NEXT_SNAPSHOT_VERSION"
          git push origin "HEAD:$RELEASE_REF"
