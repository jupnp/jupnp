name: CI

on:
  push:
    branches:
      - 'main'
      - '[0-9]+.[0-9]+.x'
    paths-ignore:
      - 'website/**'
  pull_request:
    branches:
      - 'main'
      - '[0-9]+.[0-9]+.x'
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_OPTS: -Xmx2g -Dmaven.wagon.http.retryHandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=25

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: [ '11', '17', '21', '25', '27' ]
        os: [ 'ubuntu-26.04' ]
        include:
          - java: '11'
            os: 'macos-26'
          - java: '11'
            os: 'windows-2025'
            maven_command: .\mvnw.cmd

    name: Build (Java ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up line endings
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol crlf

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Build
        run: ${{ matrix.maven_command || './mvnw' }} -B -ntp -U clean verify

      - name: Verify Changed Files
        id: verify-changed-files
        shell: bash
        run: |
          changed_files=$(echo -n "$(git diff --name-only HEAD && git ls-files --others --exclude-standard)" | tr '\n' ' ')
          echo "changed_files=$changed_files" >> "$GITHUB_OUTPUT"

      - name: Fail on Changed Files
        if: steps.verify-changed-files.outputs.changed_files != ''
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          echo "::error::Files have changed: $CHANGED_FILES"
          exit 1

  build-verification:
    name: Build verification
    if: always()
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    steps:
      - name: Check build matrix result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$BUILD_RESULT" == success ]]; then
            exit 0
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '::error::The build matrix reported %s. See the Build verification summary for job details.\n' "$BUILD_RESULT"
          printf 'The build matrix reported **%s**. [Open the CI run](%s).\n' "$BUILD_RESULT" "$run_url" >> "$GITHUB_STEP_SUMMARY"

          if details=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '
            .jobs
            | sort_by(.name)[]
            | select(.name | startswith("Build ("))
            | select(.conclusion != "success")
            | [.steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] as $steps
            | "- [\(.name)](\(.html_url)) — **\(.conclusion // .status)**"
              + (if $steps == [] then "" else " (\($steps | join(", ")))" end)
          ') && [[ -n "$details" ]]; then
            printf '\n%s\n' "$details" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          exit 1

  publish-snapshot:
    name: Publish snapshot
    if: github.ref_type == 'branch' && (github.ref_name == github.event.repository.default_branch || endsWith(github.ref_name, '.x'))
    needs: build
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17 and Maven Central credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: sonatype-central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          mvn-server-repository-origins: |
            sonatype-central:https://central.sonatype.com

      # App-authenticated release pushes also trigger CI; only deploy snapshots here.
      - name: Check snapshot version
        id: snapshot-version
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" && ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.x$ ]]; then
            exit 0
          fi

          version="$(./mvnw -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "$version" != *-SNAPSHOT ]]; then
            exit 0
          fi

          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" && "$version" != "${GITHUB_REF_NAME%.x}".* ]]; then
            echo "::warning::Skipping snapshot $version outside the $GITHUB_REF_NAME release line"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish snapshot
        if: steps.snapshot-version.outputs.publish == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: ./mvnw -B -ntp clean deploy -DskipTests
