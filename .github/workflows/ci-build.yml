name: CI

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'website/**'
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_OPTS: -Xmx2g -Dmaven.wagon.http.retryHandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=25

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: [ '11', '17', '21', '25', '26' ]
        os: [ 'ubuntu-24.04' ]
        include:
          - java: '11'
            os: 'macos-26'
          - java: '11'
            os: 'windows-2025'
            maven_command: .\mvnw.cmd
          # Additional build with Java 17 to cover the optional Jetty 12 transport
          # (the Java baseline of the project remains Java 11)
          - java: '17'
            maven: '3.9.9'
            os: 'ubuntu-24.04'

    name: Build (Java ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up line endings
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol crlf

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Build
        run: ${{ matrix.maven_command || './mvnw' }} -B -ntp -U clean verify

      - name: Verify Changed Files
        id: verify-changed-files
        shell: bash
        run: |
          changed_files=$(echo -n "$(git diff --name-only HEAD && git ls-files --others --exclude-standard)" | tr '\n' ' ')
          echo "changed_files=$changed_files" >> "$GITHUB_OUTPUT"

      - name: Fail on Changed Files
        if: steps.verify-changed-files.outputs.changed_files != ''
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          echo "::error::Files have changed: $CHANGED_FILES"
          exit 1

  publish-snapshot:
    name: Publish snapshot
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17 and Maven Central credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Publish snapshot
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: ./mvnw -B -ntp clean deploy -DskipTests
